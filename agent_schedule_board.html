<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ePlatinumHealth Office Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>html,body{margin:0;padding:0;background:#E7E5DA;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;


// Photos pulled from ePlatinumHealth's own staff/agent bio pages (eplatinumhealth.com).
const AGENT_PHOTOS = {
  "Jeffrey Martin": "jeffrey-martin.jpg",
  "Austin Streets": "austin-streets.jpg",
  "Tanner Janotta": "tanner-janotta.jpg",
  "Michael Lewis": "michael-lewis.jpg",
  "Kyle Olmstead": "kyle-olmstead.jpg",
  "Jeffrey Warren": "jeffrey-warren.jpg",
  "Gina Ensslin": "gina-ensslin.jpg",
  "Jeanne Barrett": "jeanne-barrett.jpg",
};

const LOGO_URL = "logo.png";

const AGENTS = [
  "Austin Streets",
  "Gina Ensslin",
  "Jeanne Barrett",
  "Jeffrey Martin",
  "Jeffrey Warren",
  "Kyle Olmstead",
  "Michael Lewis",
  "Tanner Janotta",
];

// These 5 agents have a verified, working calendar feed (Google Calendar).
// Jeffrey Warren's feed is synced but has only ever shown one internal
// meeting in testing, never a confirmed real client appointment -- kept
// in this set per Tanner's decision to trust it as-is. Gina Ensslin,
// Kyle Olmstead, and Michael Lewis remain manual entry until a calendar
// source is set up for them.
const SYNCED_AGENTS = new Set(["Jeffrey Martin", "Austin Streets", "Tanner Janotta", "Jeanne Barrett", "Jeffrey Warren"]);

const INITIAL_SCHEDULE = {
  "Jeffrey Martin": [],
  "Austin Streets": [],
  "Tanner Janotta": [],
  "Jeffrey Warren": [],
  "Gina Ensslin": [],
  "Jeanne Barrett": [
    { id: "jb-1", time: "09:30", client: "Jeff S.", note: "" },
    { id: "jb-2", time: "11:00", client: "Sherry R.", note: "" },
    { id: "jb-3", time: "13:30", client: "Nancy & Tom R.", note: "" },
    { id: "jb-4", time: "15:00", client: "Martha C.", note: "" },
  ],
  "Michael Lewis": [],
  "Kyle Olmstead": [],
};

// The calendar day this INITIAL_SCHEDULE was built for ("YYYY-MM-DD", local).
// If the board is still open on a later (or earlier) date and hasn't been
// refreshed yet, we hide the seeded appointments rather than show stale
// data from the wrong day.
const SCHEDULE_DATE = "2026-08-10";

const ACCENTS = ["green", "orange"];

const COLORS = {
  green: "#81C242",
  orange: "#E2872F",
  ink: "#1B1E1C",
  paper: "#E7E5DA",
  line: "#E4E3DD",
  muted: "#8C8C86",
};

function to24(time) {
  if (!time) return "99:99";
  return time;
}

function localDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function toDisplay(time) {
  if (!time) return "--:--";
  const [h, m] = time.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}

function ScheduleRow({ name, accent, appts, onRemove, synced, photoUrl }) {
  const [imgFailed, setImgFailed] = useState(false);
  const sorted = useMemo(
    () => [...appts].sort((a, b) => to24(a.time).localeCompare(to24(b.time))),
    [appts]
  );

  // If there are few enough appointments to comfortably show all at once,
  // just lay them out statically — no scrolling needed. Otherwise, fall back
  // to a continuous horizontal ticker. The track renders the appointment
  // list twice back-to-back and animates exactly one copy-width to the
  // left, on an infinite loop — so the first appointment starts flush left
  // (no lead-in gap), and the moment the last appointment exits left, the
  // repeated first appointment is already sliding in behind it. The only
  // seam is the normal item-to-item divider gap, i.e. a small break, never
  // a stretch of empty track.
  const NEEDS_SCROLL = sorted.length > 3;
  const duration = Math.max(sorted.length * 9, 20);

  const renderAppt = (a, key, hidden) => (
    <div style={styles.apptH} key={key} aria-hidden={hidden || undefined}>
      <span style={{ ...styles.time, color: COLORS[accent] }}>
        {toDisplay(a.time)}
      </span>
      <span style={styles.client}>{a.client}</span>
      {a.note ? <span style={styles.note}>{a.note}</span> : null}
      {onRemove && !hidden && (
        <button
          onClick={() => onRemove(a.id)}
          style={styles.removeBtn}
          aria-label={`Remove appointment for ${a.client}`}
        >
          x
        </button>
      )}
    </div>
  );

  return (
    <div style={styles.row}>
      <div style={{ ...styles.nameCell, borderColor: COLORS[accent] }}>
        {photoUrl && !imgFailed ? (
          <img
            src={photoUrl}
            alt={name}
            style={{ ...styles.photo, borderColor: COLORS[accent] }}
            onError={() => setImgFailed(true)}
          />
        ) : (
          <div style={{ ...styles.photoFallback, borderColor: COLORS[accent] }}>
            {name
              .split(" ")
              .map((w) => w[0])
              .join("")
              .slice(0, 2)}
          </div>
        )}
        <span style={{ ...styles.dot, background: COLORS[accent] }} />
        <span style={styles.name}>{name}</span>
      </div>

      <div style={styles.scheduleCell}>
        {sorted.length === 0 ? (
          <div style={styles.empty}>Busy</div>
        ) : NEEDS_SCROLL ? (
          <div style={styles.scrollMaskH}>
            <div
              style={{
                ...styles.scrollTrackH,
                animation: `scrollLeft ${duration}s linear infinite`,
              }}
            >
              {sorted.map((a, i) => renderAppt(a, a.id ?? i, false))}
              {sorted.map((a, i) => renderAppt(a, `dup-${a.id ?? i}`, true))}
            </div>
          </div>
        ) : (
          <div style={styles.staticRowH}>
            {sorted.map((a, i) => (
              <div style={styles.apptH} key={a.id ?? i}>
                <span style={{ ...styles.time, color: COLORS[accent] }}>
                  {toDisplay(a.time)}
                </span>
                <span style={styles.client}>{a.client}</span>
                {a.note ? <span style={styles.note}>{a.note}</span> : null}
                {onRemove && (
                  <button
                    onClick={() => onRemove(a.id)}
                    style={styles.removeBtn}
                    aria-label={`Remove appointment for ${a.client}`}
                  >
                    x
                  </button>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function AgentScheduleBoard() {
  const [schedule, setSchedule] = useState(INITIAL_SCHEDULE);
  const [form, setForm] = useState({ agent: AGENTS[0], time: "", client: "", note: "" });
  const [editMode, setEditMode] = useState(false);

  // "Step away" mode swaps the header greeting for a "be right back" message
  // and shows a footer note, without hiding the board itself. Stored in
  // localStorage so it survives the page's own 5-minute auto-refresh (a
  // plain reload would otherwise reset it).
  const [away, setAway] = useState(false);
  useEffect(() => {
    if (localStorage.getItem("eph_away") === "1") setAway(true);
  }, []);
  useEffect(() => {
    localStorage.setItem("eph_away", away ? "1" : "0");
  }, [away]);

  // Drives the ticker: each row advances to its next appointment only once
  // that appointment's scheduled time has passed, not on a fixed timer.
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(id);
  }, []);

  // If it's no longer the calendar date this board was built for (e.g. it's
  // now tomorrow and the scheduled refresh hasn't run yet), don't show
  // yesterday's or tomorrow's appointments — treat the synced rows as empty
  // until fresh data lands.
  const isStale = localDateKey(now) !== SCHEDULE_DATE;

  const addAppt = (e) => {
    e.preventDefault();
    if (!form.time || !form.client.trim()) return;
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      time: form.time,
      client: form.client.trim(),
      note: form.note.trim(),
    };
    setSchedule((prev) => ({
      ...prev,
      [form.agent]: [...prev[form.agent], entry],
    }));
    setForm((f) => ({ ...f, time: "", client: "", note: "" }));
  };

  const removeAppt = (agent, id) => {
    setSchedule((prev) => ({
      ...prev,
      [agent]: prev[agent].filter((a) => a.id !== id),
    }));
  };

  const today = new Date().toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
  });

  return (
    <div style={styles.page}>
      <style>{`
        @keyframes scrollLeft {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        input, select { font-family: inherit; }
      `}</style>

      <header
        style={{ ...styles.header, cursor: "pointer" }}
        onClick={() => setAway((v) => !v)}
        title={away ? "Click to mark as back" : "Click to step away"}
      >
        <div style={styles.headerLeft}>
          <img src={LOGO_URL} alt="ePlatinumHealth" style={styles.logo} />
          <h1 style={{ ...styles.h1, color: COLORS.orange }}>
            {away ? "We will be right with you" : "would like to welcome you to our office"}
          </h1>
        </div>
      </header>

      <div style={styles.dateBar}>
        <div style={styles.dateBox}>{today}</div>
      </div>

      <div style={styles.board}>
        {AGENTS.map((name, i) => (
          <ScheduleRow
            key={name}
            name={name}
            accent={ACCENTS[i % 2]}
            appts={isStale ? [] : schedule[name]}
            onRemove={editMode ? (id) => removeAppt(name, id) : null}
            synced={SYNCED_AGENTS.has(name)}
            photoUrl={AGENT_PHOTOS[name]}
          />
        ))}
      </div>

      {away && <div style={styles.awayFooter}>Thank you for your patience</div>}

      <div style={styles.panelToggleWrap}>
        <button style={styles.toggleBtn} onClick={() => setEditMode((v) => !v)}>
          {editMode ? "Hide entry panel" : "Add appointments"}
        </button>
      </div>

      {editMode && (
        <form onSubmit={addAppt} style={styles.form}>
          <select
            value={form.agent}
            onChange={(e) => setForm((f) => ({ ...f, agent: e.target.value }))}
            style={styles.input}
          >
            {AGENTS.map((n) => (
              <option key={n} value={n}>
                {n}
              </option>
            ))}
          </select>
          <input
            type="time"
            required
            value={form.time}
            onChange={(e) => setForm((f) => ({ ...f, time: e.target.value }))}
            style={styles.input}
          />
          <input
            type="text"
            placeholder="Client name (e.g. Linda K.)"
            required
            value={form.client}
            onChange={(e) => setForm((f) => ({ ...f, client: e.target.value }))}
            style={{ ...styles.input, flex: 1, minWidth: 140 }}
          />
          <input
            type="text"
            placeholder="Note (optional)"
            value={form.note}
            onChange={(e) => setForm((f) => ({ ...f, note: e.target.value }))}
            style={{ ...styles.input, flex: 1, minWidth: 140 }}
          />
          <button type="submit" style={styles.addBtn}>
            Add to board
          </button>
        </form>
      )}
    </div>
  );
}

const styles = {
  page: {
    fontFamily: "'Inter', system-ui, sans-serif",
    background: COLORS.paper,
    color: COLORS.ink,
    padding: "48px 56px 72px",
    minHeight: "100%",
    boxSizing: "border-box",
  },
  header: {
    display: "flex",
    justifyContent: "center",
    alignItems: "center",
    borderBottom: `5px solid ${COLORS.green}`,
    paddingBottom: 22,
    marginBottom: 20,
    gap: 18,
  },
  headerLeft: {
    display: "flex",
    alignItems: "center",
    gap: 14,
  },
  logo: {
    height: 100,
    width: "auto",
    display: "block",
    flexShrink: 0,
  },
  h1: {
    margin: 0,
    fontSize: 104,
    fontWeight: 600,

    color: COLORS.green,

  dateBar: {
    display: "flex",

    marginBottom: 20,
  },
  dateBox: {

    background: "#fff",
  },

  },

  },
  nameCell: {

    flexWrap: "wrap",
  },
  dot: { width: 13, height: 13, borderRadius: "50%", flexShrink: 0 },
  photo: {
    width: 56,
    height: 56,
    borderRadius: "50%",
    objectFit: "cover",

  },
  photoFallback: {

  },
  empty: { fontSize: 22, color: COLORS.muted, fontStyle: "italic" },

  scrollTrackH: {

    flexDirection: "row",
    alignItems: "center",
    height: 60,
    whiteSpace: "nowrap",
    willChange: "transform",
  },
  staticRowH: {

    height: 60,
    flexWrap: "nowrap",
  },
  apptH: {
    display: "flex",
    alignItems: "center",
    gap: 14,
    fontSize: 25,
    flexShrink: 0,
    paddingRight: 35,
    marginRight: 35,
    borderRight: `2px solid ${COLORS.line}`,
  },
  time: { fontWeight: 700, minWidth: 119 },
  client: { fontWeight: 600 },
  note: { color: COLORS.muted, fontSize: 21 },
  removeBtn: {
    marginLeft: "auto",
    border: "none",
    background: "transparent",
    color: COLORS.muted,
    fontSize: 25,
    cursor: "pointer",
    lineHeight: 1,
  },
  panelToggleWrap: {
    marginTop: 24,
    display: "flex",
    justifyContent: "flex-end",
    gap: 12,
  },
  toggleBtn: {
    border: `1px solid ${COLORS.green}`,
    color: COLORS.green,
    background: "#fff",
    borderRadius: 10,
    padding: "12px 20px",
    fontSize: 18,
    fontWeight: 700,
    cursor: "pointer",
  },
  awayFooter: {
    marginTop: 20,
    textAlign: "center",
    fontSize: 44,
    fontWeight: 700,
    color: COLORS.orange,
    fontFamily: "'Quicksand', 'Inter', system-ui, sans-serif",
    borderTop: `3px solid ${COLORS.green}`,
    paddingTop: 20,
  },
  form: {
    marginTop: 18,
    display: "flex",
    gap: 14,
    flexWrap: "wrap",
    alignItems: "center",
    background: "#fff",
    border: `1px solid ${COLORS.line}`,
    borderRadius: 14,
    padding: 20,
  },
  input: {
    border: `1px solid ${COLORS.line}`,
    borderRadius: 8,
    padding: "10px 14px",
    fontSize: 18,
  },
  addBtn: {
    border: "none",
    background: COLORS.orange,
    color: "#fff",
    fontWeight: 700,
    borderRadius: 8,
    padding: "12px 20px",
    fontSize: 18,
    cursor: "pointer",
  },
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AgentScheduleBoard />);
</script>
</body>
</html>
