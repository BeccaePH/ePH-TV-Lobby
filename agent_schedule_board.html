const SYNCED_AGENTS = new Set(["Jeffrey Martin", "Austin Streets", "Tanner Janotta", "Jeanne Barrett", "Jeffrey Warren"]);

const INITIAL_SCHEDULE = {

  "Austin Streets": [

  ],

// The calendar day this INITIAL_SCHEDULE was built for ("YYYY-MM-DD", local).
// If the board is still open on a later (or earlier) date and hasn't been
// refreshed yet, we hide the seeded appointments rather than show stale
// data from the wrong day.
const SCHEDULE_DATE = "2026-08-13";

const ACCENTS = ["green", "orange"];

const COLORS = {
  green: "#81C242",
  orange: "#E2872F",
  ink: "#1B1E1C",
  paper: "#E7E5DA",
  line: "#E4E3DD",
  muted: "#8C8C86",
};

function to24(time) {
  if (!time) return "99:99";
  return time;
}

function toMinutes(time) {
  if (!time) return 24 * 60;
  const [h, m] = time.split(":").map(Number);
  return h * 60 + m;
}

function localDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function toDisplay(time) {
  if (!time) return "--:--";
  const [h, m] = time.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}

function ScheduleRow({ name, accent, appts, onRemove, synced, photoUrl, now }) {
  const [imgFailed, setImgFailed] = useState(false);

  // An appointment stays visible through its scheduled time and for a
  // 20-minute grace period after — long enough for it to still be glanced
  // at while it's presumably wrapping up — then drops off the list
  // entirely rather than sitting there stale. `now` is refreshed by the
  // parent every 30 seconds, so this re-filters automatically without any
  // extra timers here.
  const DROP_OFF_GRACE_MINUTES = 20;
  const nowMinutes = useMemo(
    () => now.getHours() * 60 + now.getMinutes(),
    [now]
  );

  const sorted = useMemo(
    () =>
      [...appts]
        .filter((a) => toMinutes(a.time) + DROP_OFF_GRACE_MINUTES > nowMinutes)
        .sort((a, b) => to24(a.time).localeCompare(to24(b.time))),
    [appts, nowMinutes]
  );

  // If there are few enough appointments to comfortably show all at once,
  // just lay them out statically — no scrolling needed. Otherwise, fall back
  // to a continuous horizontal ticker. The track renders the appointment
  // list twice back-to-back and animates exactly one copy-width to the
  // left, on an infinite loop — so the first appointment starts flush left
  // (no lead-in gap), and the moment the last appointment exits left, the
  // repeated first appointment is already sliding in behind it. The only
  // seam is the normal item-to-item divider gap, i.e. a small break, never
  // a stretch of empty track.
  //
  // Appointment count alone isn't a reliable signal, though: even a single
  // appointment can have a client name too long to fit the row's available
  // width (e.g. a shared couple's name), and the static layout has no
  // wrapping -- it would just get silently clipped by scheduleCell's
  // `overflow: hidden` with no way to ever read the rest of it. So on top
  // of the count-based trigger, a hidden probe copy of the appointment
  // list (measureRowRef below) is kept in the DOM purely to measure its
  // natural, unwrapped width against the visible cell's actual width
  // (cellRef) -- if it doesn't fit, fall back to the scrolling ticker
  // regardless of how many appointments there are.
  const NEEDS_SCROLL_BY_COUNT = sorted.length > 3;
  const cellRef = useRef(null);
  const measureRowRef = useRef(null);
  const [overflowsWidth, setOverflowsWidth] = useState(false);
  useEffect(() => {
    const cellEl = cellRef.current;
    const measureEl = measureRowRef.current;
    if (!cellEl || !measureEl) return;
    const measure = () => {
      // cellEl.clientWidth includes its own left/right padding, but the
      // absolutely-positioned measureEl is positioned relative to the
      // padding edge (top:0/left:0 ignores that padding entirely) --  so
      // comparing straight against clientWidth overstates how much room
      // is really available and under-detects overflow. Subtract the
      // actual computed padding to get the true inner content width.
      const cs = getComputedStyle(cellEl);
      const paddingLeft = parseFloat(cs.paddingLeft) || 0;
      const paddingRight = parseFloat(cs.paddingRight) || 0;
      const available = cellEl.clientWidth - paddingLeft - paddingRight;
      setOverflowsWidth(measureEl.scrollWidth > available);
    };
    measure();
    if (typeof ResizeObserver === "undefined") {
      window.addEventListener("resize", measure);
      return () => window.removeEventListener("resize", measure);
    }
    const ro = new ResizeObserver(measure);
    ro.observe(cellEl);
    ro.observe(measureEl);
    return () => ro.disconnect();
  }, [sorted]);

  const NEEDS_SCROLL = NEEDS_SCROLL_BY_COUNT || overflowsWidth;

  // Speed is a fixed pixels-per-second rate, not a count-based guess, so
  // every row's ticker glides at the exact same real-world pace regardless
  // of how many appointments it has or how long the client names are —
  // the whole board reads as one continuous, evenly-flowing stream instead
  // of each row scrolling at its own arbitrary speed. The actual rendered
  // width of one copy of the list is measured live (it changes with the
  // row's own size), and the animation duration is derived from that.
  const PX_PER_SEC = 85;
  const trackRef = useRef(null);
  const [duration, setDuration] = useState(20);
  useEffect(() => {
    if (!NEEDS_SCROLL) return;
    const el = trackRef.current;
    if (!el) return;
    const measure = () => {
      const oneCopyWidth = el.scrollWidth / 2;
      setDuration(Math.max(oneCopyWidth / PX_PER_SEC, 8));
    };
    measure();
    if (typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, [NEEDS_SCROLL, sorted]);

  const renderAppt = (a, key, hidden) => (
    <div style={styles.apptH} key={key} aria-hidden={hidden || undefined}>
      <span style={{ ...styles.time, color: COLORS[accent] }}>
        {toDisplay(a.time)}
      </span>
      <span style={styles.client}>{a.client}</span>
      {onRemove && !hidden && (
        <button
          onClick={() => onRemove(a.id)}
          style={styles.removeBtn}
          aria-label={`Remove appointment for ${a.client}`}
        >
          x
        </button>
      )}
    </div>
  );

  return (
    <div style={styles.row}>
      <div style={{ ...styles.nameCell, borderColor: COLORS[accent] }}>
        {photoUrl && !imgFailed ? (
          <img
            src={photoUrl}
            alt={name}
            style={{ ...styles.photo, borderColor: COLORS[accent] }}
            onError={() => setImgFailed(true)}
          />
        ) : (
          <div style={{ ...styles.photoFallback, borderColor: COLORS[accent] }}>
            {name
              .split(" ")
              .map((w) => w[0])
              .join("")
              .slice(0, 2)}
          </div>
        )}
        <span style={{ ...styles.dot, background: COLORS[accent] }} />
        <span style={styles.name}>{name}</span>
      </div>

      <div style={styles.scheduleCell} ref={cellRef}>
        {/* Hidden probe: renders one copy of the appointment list
            off-screen, purely so its natural (unwrapped) width can be
            measured against the visible cell above (cellRef). Never
            shown, never affects layout -- see the NEEDS_SCROLL comment
            above. */}
        <div ref={measureRowRef} style={styles.measureRowH} aria-hidden="true">
          {sorted.map((a, i) => renderAppt(a, `measure-${a.id ?? i}`, true))}
        </div>
        {sorted.length === 0 ? (
          <div style={styles.empty}>Busy</div>
        ) : NEEDS_SCROLL ? (
          <div style={styles.scrollMaskH}>
            <div
              ref={trackRef}
              style={{
                ...styles.scrollTrackH,
                animation: `scrollLeft ${duration}s linear infinite`,
              }}
            >
              {sorted.map((a, i) => renderAppt(a, a.id ?? i, false))}
              {sorted.map((a, i) => renderAppt(a, `dup-${a.id ?? i}`, true))}
            </div>
          </div>
        ) : (
          <div style={styles.staticRowH}>
            {sorted.map((a, i) => (
              <div style={styles.apptH} key={a.id ?? i}>
                <span style={{ ...styles.time, color: COLORS[accent] }}>
                  {toDisplay(a.time)}
                </span>
                <span style={styles.client}>{a.client}</span>
                {onRemove && (
                  <button
                    onClick={() => onRemove(a.id)}
                    style={styles.removeBtn}
                    aria-label={`Remove appointment for ${a.client}`}
                  >
                    x
                  </button>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// Anything added through the on-page "Add appointments" panel only ever
// lived in this component's React state -- nothing tied it to anything
// more durable. That's a problem because the page auto-reloads itself
// every 5 minutes (see the meta-refresh tag in <head>), which throws away
// all React state on every reload. In practice that meant a manually
// added appointment could vanish within minutes, with no warning.
//
// Fixed the same way "away mode" below already survives the auto-refresh:
// persist to localStorage, tagged with the schedule date it belongs to.
// On load, if the stored date still matches today's SCHEDULE_DATE, restore
// the saved schedule (including manual additions/removals) instead of
// starting over from INITIAL_SCHEDULE. Once SCHEDULE_DATE moves to a new
// day (the daily 8am refresh pushes a new file with fresh real
// appointments), the stored date no longer matches, so it's ignored and
// the fresh INITIAL_SCHEDULE from the file is used instead -- yesterday's
// manual entries never leak into a new day.
//
// Caveat worth knowing: localStorage is per-browser/per-device. If the
// board is open on more than one screen (e.g. the lobby TV and someone's
// laptop), a manual addition made on one won't appear on the other --
// each keeps its own local copy for the rest of the day.
const SCHEDULE_STORAGE_KEY = "eph_schedule";
const SCHEDULE_STORAGE_DATE_KEY = "eph_schedule_date";

function loadStoredSchedule() {
  try {
    if (
      localStorage.getItem(SCHEDULE_STORAGE_DATE_KEY) === SCHEDULE_DATE &&
      localStorage.getItem(SCHEDULE_STORAGE_KEY)
    ) {
      return JSON.parse(localStorage.getItem(SCHEDULE_STORAGE_KEY));
    }
  } catch (e) {
    // Corrupted or unavailable storage (e.g. private browsing) -- fall
    // back to the file's baked-in schedule below rather than breaking.
  }
  return null;
}

function AgentScheduleBoard() {
  const [schedule, setSchedule] = useState(() => loadStoredSchedule() || INITIAL_SCHEDULE);
  useEffect(() => {
    try {
      localStorage.setItem(SCHEDULE_STORAGE_KEY, JSON.stringify(schedule));
      localStorage.setItem(SCHEDULE_STORAGE_DATE_KEY, SCHEDULE_DATE);
    } catch (e) {
      // Ignore storage write failures (e.g. quota exceeded in private
      // browsing) -- the board still works for this session, it just
      // won't survive the next auto-refresh in that case.
    }
  }, [schedule]);
  const [form, setForm] = useState({ agent: AGENTS[0], time: "", client: "" });
  const [editMode, setEditMode] = useState(false);

  // Drives the ticker: each row advances to its next appointment only once
  // that appointment's scheduled time has passed, not on a fixed timer.
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(id);
  }, []);

  // "Step away" mode swaps the header greeting for a "be right back" message
  // and shows a footer note, without hiding the board itself. Stored in
  // localStorage (alongside the date it was set) so it survives the page's
  // own 5-minute auto-refresh, but it should never carry over into a new
  // day — if the office was marked away at closing and nobody clicked it
  // back before leaving, the board shouldn't still be saying "we'll be
  // right with you" the next morning. So it's only restored on load if the
  // stored date still matches today, and it's actively cleared the moment
  // the date rolls over while the page happens to stay open across
  // midnight without reloading.
  const [away, setAway] = useState(false);
  useEffect(() => {
    const todayKey = localDateKey(new Date());
    if (
      localStorage.getItem("eph_away") === "1" &&
      localStorage.getItem("eph_away_date") === todayKey
    ) {
      setAway(true);
    } else {
      localStorage.setItem("eph_away", "0");
    }
  }, []);
  useEffect(() => {
    localStorage.setItem("eph_away", away ? "1" : "0");
    if (away) {
      localStorage.setItem("eph_away_date", localDateKey(new Date()));
    }
  }, [away]);
  const awayDateRef = useRef(localDateKey(new Date()));
  useEffect(() => {
    const todayKey = localDateKey(now);
    if (todayKey !== awayDateRef.current) {
      awayDateRef.current = todayKey;
      setAway(false);
    }
  }, [now]);

  // If it's no longer the calendar date this board was built for (e.g. it's
  // now tomorrow and the scheduled refresh hasn't run yet), don't show
  // yesterday's or tomorrow's appointments — treat the synced rows as empty
  // until fresh data lands.
  const isStale = localDateKey(now) !== SCHEDULE_DATE;

  // The welcome message must always read as a single line, never wrap,
  // regardless of screen width. Rather than guess a vw-based font size that
  // might still wrap on some resolutions, we measure the real available
  // width (header width minus logo width and gaps) against the text's
  // natural width at a large reference size, then scale the font down just
  // enough to fit on one line — capped at 107px so it never grows larger
  // than the size already chosen for this header. The measurement happens
  // on a hidden offscreen clone of the text (never on the visible h1
  // itself), so resizing it for measurement can't fight with the font size
  // React is actually rendering.
  //
  // The hidden measurement clone always renders NORMAL_WELCOME_TEXT (the
  // longer, everyday greeting), never the away-mode message — so the
  // computed size is always "whatever fits the normal header," and away
  // mode's shorter message just reuses that same size rather than being
  // fit to its own (shorter) natural width. Away mode's text is always
  // shorter, so it's guaranteed to fit at that size too; this just keeps
  // the away header and footer visually matching the main header instead
  // of rendering larger because a shorter phrase had more room to spare.
  const NORMAL_WELCOME_TEXT = "would like to welcome you to our office";
  const welcomeText = away ? "We will be right with you" : NORMAL_WELCOME_TEXT;
  const headerRef = useRef(null);
  const logoRef = useRef(null);
  const measureRef = useRef(null);
  const [welcomeFontSize, setWelcomeFontSize] = useState(107);
  useEffect(() => {
    const headerEl = headerRef.current;
    const measureEl = measureRef.current;
    if (!headerEl || !measureEl) return;
    const MIN = 18;
    const MAX = 107;
    const GAP = 14;
    const SAFETY = 32;
    const fit = () => {
      const totalW = headerEl.clientWidth;
      const logoW = logoRef.current ? logoRef.current.getBoundingClientRect().width : 0;
      const available = Math.max(totalW - logoW - GAP - SAFETY, 40);
      const natural = measureEl.scrollWidth;
      let size = natural > available ? (available / natural) * MAX : MAX;
      size = Math.min(MAX, Math.max(MIN, size));
      setWelcomeFontSize(size);
    };
    fit();
    // Re-fit on real viewport-size changes only — NOT via a ResizeObserver
    // on headerEl itself. That was the bug: setting the font size changes
    // the header's own height, which would re-trigger an observer watching
    // that same element, which recomputes and can drift a little further
    // each pass — over a few minutes of the ticker/appointment re-renders
    // nudging layout, it could creep all the way up to the 107px max and
    // get stuck there, oversized, until a full page reload reset the
    // state fresh. Listening for window resize (plus a one-time refit once
    // the Quicksand webfont finishes loading, since its metrics differ
    // from the fallback font used for the very first paint) covers every
    // real case without ever observing our own output.
    window.addEventListener("resize", fit);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fit);
    }
    // The page also does a full reload every 5 minutes (see the
    // meta-refresh tag in <head>) to stay fresh overnight. On that fresh
    // mount, the very first `fit()` above can run before the logo <img>
    // has actually finished loading/decoding, in which case its measured
    // width reads as 0 — `fit` then thinks there's more room for the
    // welcome text than there really is, and computes an oversized font
    // that sticks (nothing else re-triggers `fit` otherwise). Refit once
    // the logo is actually ready to cover that race.
    const logoEl = logoRef.current;
    if (logoEl) {
      if (logoEl.complete) {
        fit();
      } else {
        logoEl.addEventListener("load", fit);
      }
    }
    return () => {
      window.removeEventListener("resize", fit);
      if (logoEl) logoEl.removeEventListener("load", fit);
    };
    // No `away` dependency: the measurement clone below always renders
    // NORMAL_WELCOME_TEXT regardless of away mode, so there's nothing to
    // re-fit when away toggles — the same computed size just gets reused.
  }, []);

  // The whole page is locked to the screen's height (no scrolling), and the
  // header's own height can vary a lot depending on how wide the screen is
  // (the welcome message may wrap onto one, two, or three lines). That means
  // the space actually left over for each of the 8 agent rows isn't a fixed
  // number we can guess with vh-based CSS alone. Instead we measure the
  // board's real rendered height on every resize and publish it as a CSS
  // variable, so photo size / name size / appointment text size can all
  // scale to whatever room is truly available and never get clipped.
  const boardRef = useRef(null);
  useEffect(() => {
    const el = boardRef.current;
    if (!el || typeof ResizeObserver === "undefined") return;
    const GAP = 3;
    const update = (height) => {
      const rowH = (height - GAP * (AGENTS.length - 1)) / AGENTS.length;
      el.style.setProperty("--row-h", `${Math.max(rowH, 0)}px`);
    };
    update(el.getBoundingClientRect().height);
    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) update(entry.contentRect.height);
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // The board's height used to just be "whatever's left over" in the flex
  // column after the header, date bar, and the "Add appointments" button
  // (and its form, when open). That meant switching into away mode — which
  // adds the "Thank you for your patience" footer below the board — shrank
  // the board a little to make room for it, so the schedule itself was a
  // slightly different size on the away screen than on the normal one.
  //
  // Instead, the board's height is computed explicitly here, starting from
  // "the size it would be on the normal page" (viewport height minus the
  // header, date bar, and the Add-appointments button/form — never the
  // away footer). On the away screen, that's then capped so the footer
  // always has full room to render without its text getting clipped: if
  // the normal-page size wouldn't leave enough room for the header + date
  // bar + board + footer to all fit, the board shrinks just enough to make
  // that fit, and no further. The "Add appointments" button (which only
  // ever shows on the normal page anyway) staying off the away screen is
  // still fine either way — it's the footer text being fully readable that
  // matters here, not that button.
  const dateBarRef = useRef(null);
  const panelToggleWrapRef = useRef(null);
  const formRef = useRef(null);
  const footerRef = useRef(null);
  const [boardHeightPx, setBoardHeightPx] = useState(null);
  useEffect(() => {
    const PAGE_PADDING_TOP = 32;
    const PAGE_PADDING_BOTTOM = 24;
    const HEADER_MARGIN_BOTTOM = 20;
    const DATE_BAR_MARGIN_BOTTOM = 20;
    const PANEL_TOGGLE_MARGIN_TOP = 24;
    const FORM_MARGIN_TOP = 18;
    const FOOTER_MARGIN_TOP = 20;
    const measure = () => {
      const headerH = headerRef.current ? headerRef.current.getBoundingClientRect().height : 0;
      const dateBarH = dateBarRef.current ? dateBarRef.current.getBoundingClientRect().height : 0;
      const panelToggleH = panelToggleWrapRef.current
        ? panelToggleWrapRef.current.getBoundingClientRect().height
        : 0;
      const formH = formRef.current ? formRef.current.getBoundingClientRect().height : 0;
      const availableBase =
        window.innerHeight -
        PAGE_PADDING_TOP -
        PAGE_PADDING_BOTTOM -
        headerH -
        HEADER_MARGIN_BOTTOM;

      const normalHeight =
        availableBase -
        dateBarH -
        DATE_BAR_MARGIN_BOTTOM -
        panelToggleH -
        PANEL_TOGGLE_MARGIN_TOP -
        (formRef.current ? formH + FORM_MARGIN_TOP : 0);

      let target = normalHeight;
      if (away && footerRef.current) {
        const footerH = footerRef.current.getBoundingClientRect().height;
        const awayMaxHeight = availableBase - dateBarH - DATE_BAR_MARGIN_BOTTOM - footerH - FOOTER_MARGIN_TOP;
        target = Math.min(normalHeight, awayMaxHeight);
      }
      setBoardHeightPx(Math.max(target, 0));
    };
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  });

  const addAppt = (e) => {
    e.preventDefault();
    if (!form.time || !form.client.trim()) return;
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      time: form.time,
      client: form.client.trim(),
    };
    setSchedule((prev) => ({
      ...prev,
      [form.agent]: [...prev[form.agent], entry],
    }));
    setForm((f) => ({ ...f, time: "", client: "" }));
  };

  const removeAppt = (agent, id) => {
    setSchedule((prev) => ({
      ...prev,
      [agent]: prev[agent].filter((a) => a.id !== id),
    }));
  };

  const today = new Date().toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
  });

  return (
    <div style={styles.page}>
      <style>{`
        @keyframes scrollLeft {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        input, select { font-family: inherit; }
      `}</style>

      <header
        ref={headerRef}
        style={{ ...styles.header, cursor: "pointer" }}
        onClick={() => setAway((v) => !v)}
        title={away ? "Click to mark as back" : "Click to step away"}
      >
        <div style={styles.headerLeft}>
          <img ref={logoRef} src={LOGO_URL} alt="ePlatinumHealth" style={styles.logo} />
          <h1
            style={{ ...styles.h1, color: COLORS.orange, fontSize: `${welcomeFontSize}px` }}
          >
            {welcomeText}
          </h1>
          <span ref={measureRef} style={styles.welcomeMeasure} aria-hidden="true">
            {NORMAL_WELCOME_TEXT}
          </span>
        </div>
      </header>

      <div style={styles.dateBar} ref={dateBarRef}>
        <div style={styles.dateBox}>{today}</div>
      </div>

      <div
        style={{
          ...styles.board,
          height: boardHeightPx != null ? `${boardHeightPx}px` : undefined,
        }}
        ref={boardRef}
      >
        {AGENTS.map((name, i) => (
          <ScheduleRow
            key={name}
            name={name}
            accent={ACCENTS[i % 2]}
            appts={isStale ? [] : schedule[name]}
            onRemove={editMode ? (id) => removeAppt(name, id) : null}
            synced={SYNCED_AGENTS.has(name)}
            photoUrl={AGENT_PHOTOS[name]}
            now={now}
          />
        ))}
      </div>

      {away && (
        <div ref={footerRef} style={{ ...styles.awayFooter, fontSize: `${welcomeFontSize}px` }}>
          Thank you for your patience
        </div>
      )}

      <div style={styles.panelToggleWrap} ref={panelToggleWrapRef}>
        <button style={styles.toggleBtn} onClick={() => setEditMode((v) => !v)}>
          {editMode ? "Hide entry panel" : "Add appointments"}
        </button>
      </div>

      {editMode && (
        <form onSubmit={addAppt} style={styles.form} ref={formRef}>
          <select
            value={form.agent}
            onChange={(e) => setForm((f) => ({ ...f, agent: e.target.value }))}
            style={styles.input}
          >
            {AGENTS.map((n) => (
              <option key={n} value={n}>
                {n}
              </option>
            ))}
          </select>
          <input
            type="time"
            required
            value={form.time}
            onChange={(e) => setForm((f) => ({ ...f, time: e.target.value }))}
            style={styles.input}
          />
          <input
            type="text"
            placeholder="Client name (e.g. Linda K.)"
            required
            value={form.client}
            onChange={(e) => setForm((f) => ({ ...f, client: e.target.value }))}
            style={{ ...styles.input, flex: 1, minWidth: 140 }}
          />
          <button type="submit" style={styles.addBtn}>
            Add to board
          </button>
        </form>
      )}
    </div>
  );
}
